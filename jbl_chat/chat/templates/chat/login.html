{% extends "chat/base.html" %}

{% block content %}
<div class="login-form">
    <h2>JBL Chat — Login</h2>
    <form method="post" action="/login/">
        {% csrf_token %}
        <select name="user_id">
            <option value="">Select a user...</option>
            {% for user in users %}
            <option value="{{ user.id }}">{{ user.username }}</option>
            {% endfor %}
        </select>
        <button type="submit">Login</button>
    </form>
</div>
{% endblock %}
